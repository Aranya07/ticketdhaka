<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TicketDhaka: admin</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e8eaf0; --muted:#8b93a7; --accent:#5b8cff; --bad:#e05d5d; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 28px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  h1 { margin:0; font-size:19px; } h1 span { color:var(--accent); }
  main { padding:20px 28px; display:grid; gap:18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; overflow-x:auto; }
  .panel h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tile { background:#11141a; border:1px solid var(--line); border-radius:8px; padding:12px; }
  .tile b { font-size:22px; display:block; } .tile small { color:var(--muted); }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  input, select, button { font:inherit; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:#0c0e12; color:var(--text); }
  button { background:#222734; cursor:pointer; } button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.danger { color:var(--bad); }
  .form { display:flex; flex-wrap:wrap; gap:8px; } .form select { padding:7px 10px; }
  #login { max-width:360px; } #login input { width:100%; margin:4px 0 8px; }
  .muted { color:var(--muted); } a { color:var(--accent); }
  #toast { position:fixed; bottom:20px; right:20px; background:#222734; border:1px solid var(--line); padding:10px 14px; border-radius:8px; opacity:0; transition:.2s; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>Ticket<span>Dhaka</span> admin</h1>
  <div class="muted"><a href="/">site</a> · <a href="/docs">API docs</a> · <span id="who"></span> <button id="logout" style="display:none" onclick="logout()">Log out</button></div>
</header>
<main>
  <div class="panel" id="login">
    <h2>Admin sign in</h2>
    <input id="email" placeholder="admin email" />
    <input id="password" type="password" placeholder="password" />
    <button class="primary" onclick="login()">Log in</button>
  </div>
  <div id="app" style="display:none">
    <div class="panel"><h2>Overview</h2><div class="tiles" id="tiles"></div></div>
    <div class="panel" style="margin-top:18px">
      <h2>Events</h2>
      <div class="form">
        <input id="ev_title" placeholder="Title (e.g. GUB Tech Fest)" />
        <input id="ev_venue" placeholder="Venue" />
        <input id="ev_area" placeholder="Area (e.g. Gulshan)" list="areas" style="width:170px" />
        <datalist id="areas">
          <option>Gulshan</option><option>Banani</option><option>Dhanmondi</option><option>Mirpur</option><option>Uttara</option>
          <option>Motijheel</option><option>Segunbagicha</option><option>Bashundhara</option><option>Purbachal Road</option>
          <option>Old Dhaka</option><option>Savar</option><option>Gazipur</option><option>Narayanganj</option><option>Keraniganj</option>
        </datalist>
        <select id="ev_cat">
          <option>music</option><option>tech</option><option>sports</option><option>food</option><option>theatre</option>
          <option>comedy</option><option>workshop</option><option>festival</option><option>other</option>
        </select>
        <input id="ev_date" type="datetime-local" />
        <input id="ev_rows" type="number" min="1" max="26" value="5" title="rows (A-Z)" style="width:80px" />
        <input id="ev_cols" type="number" min="1" max="50" value="10" title="seats per row" style="width:80px" />
        <input id="ev_price" type="number" min="0" value="300" title="price in BDT" style="width:100px" />
        <button class="primary" onclick="addEvent()">+ Create event</button>
        <button onclick="loadDemo()" title="Adds the Dhaka sample events that aren't already there">Load Dhaka demo events</button>
      </div>
      <p class="muted" style="margin:6px 0 10px">rows × seats per row · price in ৳</p>
      <table><thead><tr><th>#</th><th>Title</th><th>Category</th><th>Venue · Area</th><th>Date</th><th>Seats left</th><th></th></tr></thead><tbody id="events"></tbody></table>
    </div>
    <div class="panel" style="margin-top:18px">
      <h2>Bookings</h2>
      <select id="status" onchange="loadBookings()">
        <option value="">all statuses</option><option>held</option><option>confirmed</option><option>cancelled</option><option>expired</option>
      </select>
      <table><thead><tr><th>#</th><th>Status</th><th>User</th><th>Event</th><th>Seat</th><th>Price</th><th>Created</th><th></th></tr></thead><tbody id="bookings"></tbody></table>
    </div>
    <div class="panel" style="margin-top:18px">
      <h2>Users</h2>
      <table><thead><tr><th>#</th><th>Email</th><th>Name</th><th>Role</th><th>Joined</th></tr></thead><tbody id="users"></tbody></table>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
let token = sessionStorage.getItem("sl_admin");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500); }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : "Error " + res.status);
  return body;
}

async function login() {
  try {
    const r = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.detail || "Login failed");
    token = b.access_token; sessionStorage.setItem("sl_admin", token); start();
  } catch (e) { toast(e.message); }
}
function logout() { sessionStorage.removeItem("sl_admin"); location.reload(); }

async function start() {
  try {
    const me = await api("/auth/me");
    if (me.role !== "admin") { toast("This account is not an admin"); return; }
    $("who").textContent = me.email; $("logout").style.display = "inline";
    $("login").style.display = "none"; $("app").style.display = "block";
    refresh(); setInterval(refresh, 15000);
  } catch { sessionStorage.removeItem("sl_admin"); }
}
function refresh() { loadStats(); loadEvents(); loadBookings(); loadUsers(); }

async function loadEvents() {
  const page = await api("/events?limit=100&include_past=true");
  const now = Date.now();
  $("events").innerHTML = page.items.map((e) => `<tr style="${new Date(e.starts_at) < now ? "opacity:.5" : ""}"><td>${e.id}</td><td>${esc(e.title)}</td>
    <td>${esc(e.category)}</td><td>${esc(e.venue)} · ${esc(e.area)}</td>
    <td>${new Date(e.starts_at).toLocaleString()}${new Date(e.starts_at) < now ? " (past)" : ""}</td><td>${e.available_seats} / ${e.total_seats}</td>
    <td><button class="danger" onclick="deleteEvent(${e.id}, '${esc(e.title).replace(/'/g, "&#39;")}')">Delete</button></td></tr>`).join("")
    || `<tr><td colspan="6" class="muted">No events.</td></tr>`;
}

async function addEvent() {
  const date = $("ev_date").value;
  if (!$("ev_title").value || !$("ev_venue").value || !date) return toast("Fill in title, venue and date");
  try {
    await api("/events", { method: "POST", body: JSON.stringify({
      title: $("ev_title").value, venue: $("ev_venue").value, area: $("ev_area").value.trim() || "Dhaka",
      category: $("ev_cat").value, starts_at: new Date(date).toISOString(),
      rows: +$("ev_rows").value, seats_per_row: +$("ev_cols").value, price_cents: Math.round(+$("ev_price").value * 100),
    }) });
    toast("Event created"); $("ev_title").value = ""; $("ev_venue").value = ""; $("ev_area").value = ""; refresh();
  } catch (e) { toast(e.message); }
}

async function loadDemo() {
  try { const r = await api("/admin/demo-events", { method: "POST" }); toast(r.created ? `Added ${r.created} Dhaka events` : "All demo events are already there"); refresh(); }
  catch (e) { toast(e.message); }
}

async function deleteEvent(id, title) {
  if (!confirm(`Delete "${title}"? All its seats and bookings are removed. This can't be undone.`)) return;
  try { await api(`/admin/events/${id}`, { method: "DELETE" }); toast("Event deleted"); refresh(); }
  catch (e) { toast(e.message); }
}

async function loadStats() {
  const s = await api("/admin/stats");
  const tile = (v, l) => `<div class="tile"><b>${esc(v)}</b><small>${esc(l)}</small></div>`;
  const users = Object.values(s.users).reduce((a, b) => a + b, 0);
  $("tiles").innerHTML = [
    tile(users, "users"), tile(s.events, "events"),
    tile(s.seats.booked || 0, "seats booked"), tile(s.seats.held || 0, "seats on hold"),
    tile(s.bookings.confirmed || 0, "confirmed bookings"), tile("৳" + s.revenue_bdt.toLocaleString(), "revenue (mock)"),
    tile(s.waitlist, "on waitlist"), tile(Math.round((s.cache.hit_rate || 0) * 100) + "%", "cache hit rate (" + s.cache.backend + ")"),
  ].join("");
}

async function loadBookings() {
  const st = $("status").value;
  const rows = await api("/admin/bookings" + (st ? "?status=" + st : ""));
  $("bookings").innerHTML = rows.map((b) => `<tr><td>${b.id}</td><td>${esc(b.status)}</td><td>${esc(b.user_email)}</td>
    <td>${esc(b.event_title)}</td><td>${esc(b.seat_label)}</td><td>৳${(b.price_cents / 100).toFixed(0)}</td>
    <td>${new Date(b.created_at).toLocaleString()}</td>
    <td>${b.status === "held" || b.status === "confirmed" ? `<button class="danger" onclick="release(${b.seat_id}, '${esc(b.seat_label)}')">Release seat</button>` : ""}</td></tr>`).join("")
    || `<tr><td colspan="8" class="muted">No bookings yet.</td></tr>`;
}

async function release(seatId, label) {
  if (!confirm(`Release seat ${label}? The user's booking will be cancelled.`)) return;
  try { await api(`/admin/seats/${seatId}/release`, { method: "POST" }); toast("Seat released"); refresh(); }
  catch (e) { toast(e.message); }
}

async function loadUsers() {
  const rows = await api("/admin/users?limit=200");
  $("users").innerHTML = rows.map((u) => `<tr><td>${u.id}</td><td>${esc(u.email)}</td><td>${esc(u.name)}</td>
    <td><select onchange="setRole(${u.id}, this.value)">${["attendee", "organizer", "admin"].map((r) =>
      `<option ${r === u.role ? "selected" : ""}>${r}</option>`).join("")}</select></td>
    <td>${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join("");
}

async function setRole(id, role) {
  try { await api(`/admin/users/${id}/role`, { method: "PATCH", body: JSON.stringify({ role }) }); toast("Role updated"); }
  catch (e) { toast(e.message); loadUsers(); }
}

if (token) start();
</script>
</body>
</html>
