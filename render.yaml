# Render Blueprint for TicketDhaka.
# NOTE: the resource names below (seatlock, seatlock-db, seatlock-cache) are the ORIGINAL names from
# the first deploy. Don't rename them: Render would create new, empty resources (a fresh database)
# instead of renaming the existing ones. The public brand is TicketDhaka; these are internal IDs.
services:
  - type: web
    name: seatlock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: seatlock-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: seatlock-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false        # Render asks you for the value; it never goes into git
      - key: ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: seatlock-cache
    plan: free
    ipAllowList: []

databases:
  - name: seatlock-db
    plan: free
