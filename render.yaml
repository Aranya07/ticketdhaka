# Render Blueprint for TicketDhaka.
# NOTE: resource names are Render's internal IDs. Renaming one later makes Render create a NEW,
# empty resource (a fresh database) instead of renaming the existing one.
services:
  - type: web
    name: ticketdhaka
    # Built from the Dockerfile, so production runs the same image as `docker compose up`.
    # The Dockerfile sets the Python version and the start command (uvicorn on Render's $PORT).
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketdhaka-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticketdhaka-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false        # Render asks you for the value; it never goes into git
      - key: ADMIN_PASSWORD
        sync: false
      # aamarPay (bKash, Nagad, Rocket, cards). Sandbox: store ID aamarpaytest and the signature key
      # from aamarPay's docs. Leave empty to keep the demo payment gateway.
      - key: AAMARPAY_STORE_ID
        sync: false
      - key: AAMARPAY_SIGNATURE_KEY
        sync: false
      - key: AAMARPAY_SANDBOX
        value: "true"

  - type: keyvalue
    name: ticketdhaka-cache
    plan: free
    ipAllowList: []

databases:
  - name: ticketdhaka-db
    plan: free
