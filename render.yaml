# Render Blueprint for TicketDhaka.
# NOTE: resource names are Render's internal IDs. Renaming one later makes Render create a NEW,
# empty resource (a fresh database) instead of renaming the existing one.
services:
  - type: web
    name: ticketdhaka
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ticketdhaka-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticketdhaka-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false        # Render asks you for the value; it never goes into git
      - key: ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: ticketdhaka-cache
    plan: free
    ipAllowList: []

databases:
  - name: ticketdhaka-db
    plan: free
